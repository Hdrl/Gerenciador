<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações do Destinatário</title>
    <style>
        body {
            /* Usando uma fonte monoespaçada para garantir alinhamento,
               ou pode usar Arial, sans-serif como antes. */
            font-family: "Courier New", Courier, monospace;
            margin: 20px;
        }
        .container {
            border: 2px solid #333;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5em; /* Tamanho grande */
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .info-row {
            display: flex; /* Cria um layout flexível */
            font-size: 1.8em; /* Tamanho grande */
            line-height: 1.6;
            margin: 10px 0;
        }
        .label {
            font-weight: bold;
            width: 220px; /* Aumenta o espaço para o rótulo "ENDEREÇO:" */
            flex-shrink: 0; /* Impede que o rótulo encolha */
        }
        .value {
            /* O valor ocupa o espaço restante */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>D E S T I N A T Á R I O</h1>
    
        <div class="info-row">
            <span class="label">NOME:</span>
            <span class="value">Adriano Correa</span>
        </div>
        <div class="info-row">
            <span class="label">ENDEREÇO:</span>
            <span class="value">Estrada do Ganchinho, 957</span>
        </div>
        <div class="info-row">
            <span class="label">CIDADE:</span>
            <span class="value">Curitiba</span>
        </div>
        <div class="info-row">
            <span class="label">UF:</span>
            <span class="value">PR</span>
        </div>
        <div class="info-row">
            <span class="label">CEP:</span>
            <span class="value">81930165</span>
        </div>
        <div class="info-row">
            <span class="label">NF:</span>
            <span class="value">522</span>
        </div>
    </div>

</body>
</html>
